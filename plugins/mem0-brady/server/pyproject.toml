[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem0-mcp-selfhosted"
version = "0.11.0"
description = "Self-hosted mem0 MCP server for Claude Code"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "elvismdev" },
]
# Base install runs mem0 over MCP: the hook console scripts talk to a mem0 MCP
# server and never import mem0 themselves, so they need nothing heavier than an
# MCP client. Installing the SERVER (or hooks that drive mem0 in-process) needs
# the `direct` extra below.
dependencies = [
    # Pinned below 2.x for the same reason as mem0ai: `uv tool install`
    # re-resolves from these constraints and ignores uv.lock, so an unbounded
    # spec silently upgrades on every rebuild. mcp 2.0.0 renamed the
    # `mcp.server.fastmcp` module that server.py imports, so an unpinned build
    # produces an image that crash-loops on startup. Lifting the bound means
    # porting server.py to the 2.x API, not just widening this line.
    "mcp[cli]>=1.23.0,<2",
    "python-dotenv>=1.2.1",
]

[project.scripts]
mem0-mcp-selfhosted = "mem0_mcp_selfhosted:main"
mem0-hook-context = "mem0_mcp_selfhosted.hooks:context_main"
mem0-hook-stop = "mem0_mcp_selfhosted.hooks:stop_main"
mem0-hook-prompt = "mem0_mcp_selfhosted.hooks:prompt_main"
mem0-hook-filecontext = "mem0_mcp_selfhosted.hooks:file_context_main"
mem0-hook-precompact = "mem0_mcp_selfhosted.hooks:precompact_main"
mem0-install-hooks = "mem0_mcp_selfhosted.hooks:install_main"

[project.optional-dependencies]
# Everything needed to drive mem0 IN-PROCESS. Required by the server, and by
# hooks on a managed stack (no MCP server to delegate to). A host that reaches
# an external server over MCP needs none of it — which is the difference between
# a multi-GB install and a small one.
#
# Pin to the 2.x line: the fork's server/hooks/config target mem0ai 2.x
# (validated against 2.0.4/2.0.5). `uv tool install` re-resolves from these
# constraints (it ignores uv.lock), so an upper bound keeps installs
# reproducible against a future 3.x. The `graph` extra was dropped in 2.x
# (graph deps come from `neo4j` below); team config disables graph anyway.
direct = [
    "mem0ai[llms]>=2.0.4,<3",
    "anthropic>=0.77.0",
    "neo4j>=5.23.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# In-process local reranking (CrossEncoder). Pulls torch transitively, so it is
# opt-in: `pip install mem0-mcp-selfhosted[rerank]`. Enable at runtime with
# MEM0_RERANK_PROVIDER=sentence_transformer.
rerank = [
    "sentence-transformers>=5.0",
]
# ZeroEntropy hosted API — used by the custom zembed-1 embedder
# (MEM0_EMBED_PROVIDER=zeroentropy) and/or mem0ai's built-in zerank reranker
# (MEM0_RERANK_PROVIDER=zero_entropy). Lightweight HTTP client, no torch.
zeroentropy = [
    "zeroentropy>=0.1.0",
]







[tool.hatch.build.targets.wheel]
packages = ["src/mem0_mcp_selfhosted"]


[tool.pytest.ini_options]
markers = [
    "integration: tests that require live infrastructure (Qdrant, Ollama, Anthropic, Neo4j)",
    "contract: tests that validate mem0ai internal API stability",
]


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mem0_mcp_selfhosted/__init__.py:__version__"]
branches.main = { match = "main", prerelease = false }
tag_format = "v{version}"
commit_parser = "angular"
commit_message = "chore(release): v{version} [skip ci]"
upload_to_pypi = false
upload_to_repository = false

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf"]
minor_tags = ["feat"]
allowed_tags = [
    "build", "chore", "ci", "docs", "feat", "fix",
    "perf", "refactor", "style", "test",
]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge ",
]

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
