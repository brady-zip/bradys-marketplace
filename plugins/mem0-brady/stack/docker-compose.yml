# The compose stack: Qdrant + the mem0 MCP server, in Docker.
#
# Lives here, beside the vendored fork it builds from, so the server image and
# the plugin's recall/capture hooks are the SAME code by construction. When this
# was a loose directory outside any repo, the image built from git while the
# hooks ran the vendored source — nothing forced them to agree.
#
# Config comes from ~/.config/mem0-brady/.env — the SAME file the hooks source.
# There is deliberately no .env beside this file: a second copy inside the source
# tree is how a live API key ends up in a checkout and how edits land on the copy
# nothing reads. Run /mem0-brady:setup, which owns that file and this stack, or
# by hand:
#   docker compose --env-file ~/.config/mem0-brady/.env up -d --build
#
# The compose project name defaults to mem0-host for continuity with the
# pre-vendoring deployment. Changing it does NOT move data (the volume is a bind
# mount), but it DOES create a second set of containers alongside the old ones —
# remove the originals first if you rename.
name: ${MEM0_BRADY_COMPOSE_PROJECT:-mem0-host}

services:
  # Vector store — the actual shared memory.
  #
  # `expose` is what mem0-mcp uses over the compose network. The published host
  # port is separate and NOT optional if you run the mem0-brady plugin's hooks:
  # they instantiate mem0 directly in a host process rather than calling the MCP
  # server, so a container-network-only Qdrant is invisible to them and recall
  # silently returns nothing. Loopback-only, so nothing on the LAN can reach it.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      # Absolute path, set in the config — deliberately not a relative path, so
      # the data does not move just because this file did.
      - ${MEM0_BRADY_QDRANT_STORAGE:?set MEM0_BRADY_QDRANT_STORAGE in ~/.config/mem0-brady/.env}:/qdrant/storage
    expose:
      - "6333"
    ports:
      - "127.0.0.1:${MEM0_BRADY_QDRANT_HOST_PORT:-6333}:6333"

  # The MCP server (streamable-http). Built from ../server, the vendored fork.
  # Host port is bound to 127.0.0.1 ONLY: cloudflared (running on the host) can
  # reach it; nothing on the LAN can.
  mem0-mcp:
    build:
      # Context is the plugin root so the Dockerfile can COPY the vendored
      # server/ tree. Dockerfile path is relative to that context.
      context: ..
      dockerfile: stack/Dockerfile
    restart: unless-stopped
    # Absolute, and the same file `--env-file` above resolves. Interpolated
    # rather than hardcoded so this works for any $HOME and stays overridable
    # for testing against a scratch config dir.
    env_file: ${MEM0_BRADY_CONFIG_ENV:-$HOME/.config/mem0-brady/.env}
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:${MEM0_BRADY_MCP_HOST_PORT:-8081}:8081"
